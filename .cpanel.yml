---
deployment:
  tasks:
    - export APP=$PWD
    - export BUILD=$HOME/readererer-build/$(basename $PWD)
    - export PATH=/opt/alt/alt-nodejs24/root/usr/bin:$PATH:/usr/local/cpanel/3rdparty/bin
    - test -f $APP/.env
    - mkdir -p $BUILD
    - find $BUILD -mindepth 1 -maxdepth 1 ! -name vendor ! -name node_modules -exec rm -rf {} +
    - git archive HEAD | tar -x -C $BUILD
    - git describe --tags --always > $BUILD/VERSION
    - cd $BUILD && composer install --no-dev --no-scripts --no-interaction --no-progress --optimize-autoloader
    - cd $BUILD && npm ci --no-audit --no-fund
    - cd $BUILD && npm run build
    - cd $APP && php artisan down
    - rsync -a --delete $BUILD/app $BUILD/bootstrap $BUILD/config $BUILD/lang $BUILD/resources $BUILD/routes $BUILD/vendor $APP/
    - rsync -a --delete '--exclude=*.sqlite*' $BUILD/database/ $APP/database/
    - rsync -a --delete $BUILD/public/build $BUILD/public/js $APP/public/
    - cp $BUILD/artisan $BUILD/composer.json $BUILD/composer.lock $BUILD/VERSION $APP/
    - cp $BUILD/public/index.php $BUILD/public/.htaccess $BUILD/public/favicon.ico $BUILD/public/robots.txt $APP/public/
    - cd $APP && php artisan package:discover
    - cd $APP && php artisan migrate --force
    - cd $APP && php artisan optimize
    - cd $APP && php artisan event:cache
    - cd $APP && php artisan queue:restart
    - cd $APP && php artisan up
