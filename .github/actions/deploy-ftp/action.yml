name: Deploy over FTP
description: Uploads the checkout and build artifact over FTPS into maintenance mode, then calls the deploy endpoint to migrate and bring the app up.

inputs:
  domain:
    required: true
  ftp-host:
    required: true
  ftp-user:
    required: true
  ftp-password:
    required: true
  deploy-token:
    required: true
  version:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: build
    - shell: bash
      env:
        LFTP_PASSWORD: ${{ inputs.ftp-password }}
        DEPLOY_TOKEN: ${{ inputs.deploy-token }}
      run: |
        test -n '${{ inputs.domain }}'
        echo '${{ inputs.version }}' > VERSION
        echo '{}' > down
        sudo apt-get install -y -qq lftp
        lftp <<'EOF'
        set cmd:fail-exit true
        set ftp:ssl-force true
        set ssl:verify-certificate true
        open --env-password -u '${{ inputs.ftp-user }}' '${{ inputs.ftp-host }}'
        mirror -R storage storage
        put down -o storage/framework/down
        mirror -R --delete --parallel=8 bootstrap bootstrap
        mirror -R --delete --parallel=8 --exclude-glob *.sqlite* database database
        mirror -R --delete --parallel=8 vendor vendor
        mirror -R --delete --parallel=8 app app
        mirror -R --delete --parallel=8 config config
        mirror -R --delete --parallel=8 lang lang
        mirror -R --delete --parallel=8 resources resources
        mirror -R --delete --parallel=8 routes routes
        mirror -R --delete --parallel=8 public/build public/build
        mirror -R --delete --parallel=8 public/js public/js
        mput -d artisan composer.json composer.lock VERSION public/index.php public/.htaccess public/favicon.ico public/robots.txt
        EOF
        curl --fail-with-body -sS -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" 'https://${{ inputs.domain }}/_deploy'
