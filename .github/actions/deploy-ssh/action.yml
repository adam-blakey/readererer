name: Deploy over SSH
description: Deploys this checkout and the build artifact as a new Deployer release, migrates, switches the site to it and checks the site answers.

inputs:
  domain:
    required: true
  ssh-host:
    required: true
  ssh-port:
    required: true
  ssh-user:
    required: true
  ssh-private-key:
    required: true
  fresh-database:
    description: Run migrate:fresh --seed instead of migrate.
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        test -n '${{ inputs.domain }}'
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/deploy
        chmod 600 ~/.ssh/deploy
        echo "$(git describe --tags --always)${{ github.event.pull_request.number && format('+pr{0}', github.event.pull_request.number) || '' }}" > VERSION
        curl -sSLo "$RUNNER_TEMP/deployer.phar" https://github.com/deployphp/deployer/releases/download/v8.0.5/deployer.phar
        echo "0026dfa73626a8ccde06222fe5fccf03e6d4a19e765914bb87d7d2cc21f3e57d  $RUNNER_TEMP/deployer.phar" | sha256sum -c
    - shell: bash
      env:
        APP_DOMAIN: ${{ inputs.domain }}
        DEPLOY_SSH_HOST: ${{ inputs.ssh-host }}
        DEPLOY_SSH_PORT: ${{ inputs.ssh-port }}
        DEPLOY_SSH_USER: ${{ inputs.ssh-user }}
        FRESH_DATABASE: ${{ inputs.fresh-database }}
      run: php "$RUNNER_TEMP/deployer.phar" deploy site --no-interaction -v
    - uses: ./.github/actions/check-site
      with:
        domain: ${{ inputs.domain }}
