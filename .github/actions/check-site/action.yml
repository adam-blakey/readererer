name: Check site
description: Fails unless the site's health check and login page both answer HTTP 200.

inputs:
  domain:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for path in health login; do
          url="https://${{ inputs.domain }}/$path"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-connrefused --max-time 30 "$url" || true)
          echo "$url: HTTP $code"
          test "$code" = 200 || { echo "::error::$url answered HTTP $code, not 200."; exit 1; }
        done
