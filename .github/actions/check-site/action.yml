name: Check site
description: Fails unless the site's health check and login page both answer HTTP 200.

inputs:
  domain:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for path in health login; do
          url="https://${{ inputs.domain }}/$path"
          read -r code location < <(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' --retry 5 --retry-delay 10 --retry-connrefused --max-time 30 "$url" || true)
          echo "$url: HTTP $code $location"
          test "$code" = 200 || { echo "::error::$url answered HTTP $code${location:+ (redirect to $location)}, not 200."; exit 1; }
        done
