version: 2

# Every Composer and npm version bump goes into one shared pull request.
# Dependabot refreshes that pull request with any newer bumps on each
# scheduled run until it is merged.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "composer"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
