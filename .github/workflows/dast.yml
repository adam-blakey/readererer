name: "DAST"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Build the app image
      run: docker build -t readererer .

    - name: Start the app
      run: |
        docker run -d --name readererer -p 8080:80 \
          -e APP_ENV=production \
          -e APP_KEY="base64:$(openssl rand -base64 32)" \
          -e APP_URL=http://localhost:8080 \
          readererer
        curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/health

    - name: Run ZAP baseline scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: http://localhost:8080
        allow_issue_writing: false

    - name: Report logged-out findings in the job summary
      if: always() && hashFiles('report_md.md') != ''
      run: |
        echo "# Logged out" >> "$GITHUB_STEP_SUMMARY"
        cat report_md.md >> "$GITHUB_STEP_SUMMARY"
        rm report_md.md

    - name: Log in as an admin
      run: |
        url=http://localhost:8080
        jar=$(mktemp)
        token() { grep -m1 -o 'name="_token" value="[^"]*"' | cut -d'"' -f4; }

        account=$(docker exec -u www-data readererer php artisan user:create ZAP Scanner zap@example.com --role=admin)
        username=$(sed -n 's/^Username: //p' <<< "$account")
        password=$(sed -n 's/^Temporary password: //p' <<< "$account")
        new_password=$(openssl rand -base64 24)

        token=$(curl -sf -c "$jar" -b "$jar" "$url/login" | token)
        curl -sf -c "$jar" -b "$jar" -o /dev/null "$url/login" --data-urlencode "_token=$token" \
          --data-urlencode "username=$username" --data-urlencode "password=$password"
        # New accounts must change their password before anything else.
        token=$(curl -sf -c "$jar" -b "$jar" "$url/password" | token)
        curl -sf -c "$jar" -b "$jar" -o /dev/null "$url/password" --data-urlencode "_token=$token" -d _method=PUT \
          --data-urlencode "password=$new_password" --data-urlencode "password_confirmation=$new_password"
        test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$url/dashboard")" = 200

        cookie=$(sed 's/^#HttpOnly_//' "$jar" | awk '!/^#/ && NF == 7 { printf "%s%s=%s", sep, $6, $7; sep = "; " }')
        echo "::add-mask::$cookie"
        echo "ZAP_AUTH_HEADER_VALUE=$cookie" >> "$GITHUB_ENV"

    # The spider only follows links, so it cannot log itself out or change data with the forms it finds.
    - name: Run ZAP baseline scan as an admin
      uses: zaproxy/action-baseline@v0.15.0
      env:
        ZAP_AUTH_HEADER: Cookie
        ZAP_AUTH_HEADER_SITE: localhost:8080
      with:
        target: http://localhost:8080/dashboard
        cmd_options: -z "-config spider.postform=false"
        allow_issue_writing: false
        artifact_name: zap_scan_admin

    - name: Report admin findings in the job summary
      if: always() && hashFiles('report_md.md') != ''
      run: |
        echo "# Logged in as an admin" >> "$GITHUB_STEP_SUMMARY"
        cat report_md.md >> "$GITHUB_STEP_SUMMARY"

    - name: Show app logs
      if: failure()
      run: docker logs readererer
