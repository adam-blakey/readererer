name: Build, Test & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: Pest test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - uses: ramsey/composer-install@v4
      - run: ./vendor/bin/pint --test
      - run: php artisan key:generate
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: php artisan test --parallel --testsuite=Unit,Feature --log-junit ./junit.xml
      - run: php artisan test --testsuite=Browser --log-junit ./junit-browser.xml
      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
      # Production build smoke test. Must run after the tests: a cached config ignores APP_ENV=testing and CSRF would be enforced.
      - run: php artisan optimize --env=production
        if: github.ref == 'refs/heads/main'
      - run: php artisan event:cache
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: junit*.xml
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            vendor
            public/build
          include-hidden-files: true

  deploy_dev:
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build_and_test
    runs-on: ubuntu-24.04
    concurrency: deploy-dev
    environment:
      name: dev
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-ssh
        with:
          domain: ${{ vars.APP_DOMAIN }}
          ssh-host: ${{ vars.DEPLOY_SSH_HOST }}
          ssh-port: ${{ vars.DEPLOY_SSH_PORT }}
          ssh-user: ${{ vars.DEPLOY_SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          git-key: ${{ vars.DEPLOY_GIT_KEY }}
          fresh-database: 'true'

  deploy_qa:
    if: github.event_name != 'pull_request'
    needs: deploy_dev
    runs-on: ubuntu-24.04
    concurrency: deploy-qa
    environment:
      name: qa
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-ssh
        with:
          domain: ${{ vars.APP_DOMAIN }}
          ssh-host: ${{ vars.DEPLOY_SSH_HOST }}
          ssh-port: ${{ vars.DEPLOY_SSH_PORT }}
          ssh-user: ${{ vars.DEPLOY_SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          git-key: ${{ vars.DEPLOY_GIT_KEY }}

  deploy_prod:
    needs: deploy_qa
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    concurrency: deploy-prod
    environment:
      name: prod
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - name: Cancel if a newer run is on its way
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          newer=$(gh run list --workflow deploy.yml --branch main --json databaseId,status --jq 'map(select(.databaseId > ${{ github.run_id }} and .status != "completed")) | length')
          if [ "$newer" -gt 0 ]; then
            gh run cancel ${{ github.run_id }}
            sleep 300
          fi
      - id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          default_bump: minor
          dry_run: true
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-ftp
        with:
          domain: ${{ vars.APP_DOMAIN }}
          ftp-host: ${{ vars.DEPLOY_FTP_HOST }}
          ftp-user: ${{ vars.DEPLOY_FTP_USER }}
          ftp-password: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          deploy-token: ${{ secrets.DEPLOY_TOKEN }}
          version: ${{ steps.version.outputs.new_tag || steps.version.outputs.previous_tag }}
      - if: steps.version.outputs.new_tag
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  docs:
    if: github.ref == 'refs/heads/main'
    needs: deploy_prod
    runs-on: ubuntu-24.04
    concurrency: deploy-docs
    environment:
      name: docs
      url: https://${{ vars.APP_DOMAIN }}
    env:
      SSH: ssh -i ~/.ssh/deploy -p ${{ vars.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no
      HOST: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          test -n '${{ vars.APP_DOMAIN }}'
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
      # Refuse to overwrite a folder that still holds the app (and its .env and database).
      - run: $SSH $HOST "test ! -e domains/${{ vars.APP_DOMAIN }}/artisan && mkdir -p domains/${{ vars.APP_DOMAIN }}/public"
      - run: rsync -rtzL --delete -e "$SSH" site/ "$HOST:domains/${{ vars.APP_DOMAIN }}/public/"
