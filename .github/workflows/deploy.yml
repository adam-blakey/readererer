name: Build, Test & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: Pest test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - uses: ramsey/composer-install@v3
      - run: ./vendor/bin/pint --test
      - run: php artisan key:generate
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: php artisan test --parallel --testsuite=Unit,Feature --log-junit ./junit.xml
      - run: php artisan test --testsuite=Browser --log-junit ./junit-browser.xml
      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
      # Production build smoke test. Must run after the tests: a cached config ignores APP_ENV=testing and CSRF would be enforced.
      - run: php artisan optimize --env=production
        if: github.ref == 'refs/heads/main'
      - run: php artisan event:cache
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: junit*.xml
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            vendor
            public/build
          include-hidden-files: true

  deploy:
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build_and_test
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    strategy:
      max-parallel: 1 # dev, then qa, then prod; a failure skips the rest
      matrix:
        environment: [dev, qa, prod]
        exclude:
          - environment: ${{ github.event_name == 'pull_request' && 'qa' || '' }}
          - environment: ${{ github.event_name == 'pull_request' && 'prod' || '' }}
    concurrency: deploy-${{ matrix.environment }}
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ vars.APP_DOMAIN }}
    env:
      SSH: ssh -i ~/.ssh/deploy -p ${{ vars.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no
      HOST: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
    steps:
      - name: Cancel if a newer run is on its way
        if: matrix.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          newer=$(gh run list --workflow deploy.yml --branch main --json databaseId,status --jq 'map(select(.databaseId > ${{ github.run_id }} and .status != "completed")) | length')
          if [ "$newer" -gt 0 ]; then
            gh run cancel ${{ github.run_id }}
            sleep 300
          fi
      - id: version
        if: matrix.environment == 'prod'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          default_bump: minor
          dry_run: true
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: |
          test -n '${{ vars.APP_DOMAIN }}'
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
      - run: rsync -rltz --delete -e "$SSH" vendor public/build --relative "$HOST:domains/${{ vars.APP_DOMAIN }}/"
      - run: |
          $SSH $HOST bash -es <<'EOF'
            set -e
            cd domains/${{ vars.APP_DOMAIN }}
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/${{ vars.DEPLOY_GIT_KEY }} -o IdentitiesOnly=yes"
            git init -q
            git fetch --tags --force git@github.com:${{ github.repository }}.git ${{ github.sha }}
            git reset --hard FETCH_HEAD
            if [ ! -f .env ]; then
              echo "No .env in ~/domains/${{ vars.APP_DOMAIN }}: copy .env.example to .env, fill it in, then re-run this deploy." >&2
              exit 1
            fi
            rm -f bootstrap/cache/*.php
            if [ '${{ matrix.environment }}' = 'prod' ]; then
              tag='${{ steps.version.outputs.new_tag || steps.version.outputs.previous_tag }}'
            else
              tag="$(git describe --tags --always)${{ github.event.pull_request.number && format('+pr{0}', github.event.pull_request.number) || '' }}"
            fi
            # Krystal disables proc_open, so git must not be run from PHP.
            php artisan app:generate-version --tag="$tag" --hash="$(git log --pretty=%h -n1)" --date="$(git log --pretty=%cI -n1)"
            php artisan down
            trap 'php artisan up' EXIT
            if [ '${{ matrix.environment }}' = 'dev' ]; then
              php artisan migrate:fresh --seed --force
            else
              php artisan migrate --force
            fi
            php artisan optimize
            php artisan event:cache
            php artisan queue:restart
          EOF
      - if: matrix.environment == 'prod'
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.new_tag || steps.version.outputs.previous_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  docs:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    concurrency: deploy-docs
    environment:
      name: docs
      url: https://${{ vars.APP_DOMAIN }}
    env:
      SSH: ssh -i ~/.ssh/deploy -p ${{ vars.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no
      HOST: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          test -n '${{ vars.APP_DOMAIN }}'
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
      # Refuse to overwrite a folder that still holds the app (and its .env and database).
      - run: $SSH $HOST "test ! -e domains/${{ vars.APP_DOMAIN }}/artisan && mkdir -p domains/${{ vars.APP_DOMAIN }}/public"
      - run: rsync -rtzL --delete -e "$SSH" site/ "$HOST:domains/${{ vars.APP_DOMAIN }}/public/"
